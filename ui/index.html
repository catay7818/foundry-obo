<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media AI Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login Screen -->
      <div id="login-screen" class="screen">
        <div class="login-card">
          <h1>Media AI Assistant</h1>
          <p>
            Sign in with your Microsoft account to access production data for
            your shows.
          </p>
          <button id="login-btn" class="btn btn-primary">Sign in</button>
        </div>
      </div>

      <!-- Chat Screen -->
      <div id="chat-screen" class="screen hidden">
        <header>
          <h1>Media AI Assistant</h1>
          <div class="user-info">
            <span id="user-name"></span>
            <button id="logout-btn" class="btn btn-secondary">Sign out</button>
          </div>
        </header>
        <div id="chat-messages"></div>
        <form id="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Ask about your shows..."
            autocomplete="off"
            required
          />
          <button type="submit" class="btn btn-primary" id="send-btn">
            Send
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
